name: CLI CI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/cli.yml"
      - ".github/workflows/release.yml"

jobs:
  cli-linux:
    name: Linux CI (Format, Check, Test & Clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check Formatting
        run: cargo fmt --check

      - name: Cargo Check
        run: cargo check --locked

      - name: Run Tests
        run: cargo test --locked

      - name: Run Clippy Linter
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check installer script (sh)
        run: |
          sh -n install/install.sh
          shellcheck --severity=warning install/install.sh

  cli-windows:
    name: Windows CI (MSVC Build & Test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Cargo Check
        run: cargo check --target x86_64-pc-windows-msvc --locked

      - name: Run Tests
        run: cargo test --target x86_64-pc-windows-msvc --locked

      - name: Parse installer script (PowerShell)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
