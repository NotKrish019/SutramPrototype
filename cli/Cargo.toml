[package]
name = "yukti-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Command-line client for the YUKTI forensic API. Talks to the Rust API over HTTP only."
publish = false

[lib]
name = "yukti_cli"
path = "src/lib.rs"

[[bin]]
name = "yukti"
path = "src/main.rs"

[dependencies]
anstyle = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
terminal_size = "0.4"
tokio = { version = "1.40", features = ["rt", "macros", "time"] }
